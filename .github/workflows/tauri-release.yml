name: Build Tauri Release

on:
  push:
    branches: ["master"]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
    paths-ignore:
      - "website/**"

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.context.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine release context
        id: context
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify tag matches all source versions
        if: steps.context.outputs.is_release == 'true'
        shell: bash
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(jq -r '.version' package.json)
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)
          test "$PKG_VERSION" = "$EXPECTED"
          test "$TAURI_VERSION" = "$EXPECTED"
          test "$CARGO_VERSION" = "$EXPECTED"

  build:
    name: Package (${{ matrix.artifact_label }})
    needs: [quality, prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            artifact_label: linux-x86_64
            artifact_path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - runner: windows-latest
            platform: windows
            artifact_label: windows-x86_64
            artifact_path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - runner: macos-15
            platform: macos
            artifact_label: macos-apple-silicon
            rust_target: aarch64-apple-darwin
            expected_arch: arm64
            tauri_args: --target aarch64-apple-darwin
            artifact_path: dist/macos/macos-apple-silicon/**
          - runner: macos-15-intel
            platform: macos
            artifact_label: macos-intel
            rust_target: x86_64-apple-darwin
            expected_arch: x86_64
            tauri_args: --target x86_64-apple-darwin
            artifact_path: dist/macos/macos-intel/**
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add explicit macOS Rust target
        if: matrix.platform == 'macos'
        run: rustup target add ${{ matrix.rust_target }}
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build non-macOS package
        if: matrix.platform != 'macos'
        uses: tauri-apps/tauri-action@v0
      - name: Build ad-hoc-signed macOS preview
        if: matrix.platform == 'macos'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: ${{ matrix.tauri_args }}
      - name: Verify and stage macOS preview
        if: matrix.platform == 'macos'
        shell: bash
        run: >-
          bash .github/scripts/verify-macos-ad-hoc.sh
          "${{ matrix.rust_target }}"
          "${{ matrix.expected_arch }}"
          "${{ matrix.artifact_label }}"
      - name: Exercise secondary windows
        if: matrix.platform == 'windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:KEYBOARD_HELPER_SMOKE_REPORT = "$PWD\secondary-window-smoke.json"
          $process = Start-Process -FilePath "src-tauri\target\release\keyboard-app.exe" -ArgumentList "--quality-smoke-secondary-windows" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $report = Get-Content $env:KEYBOARD_HELPER_SMOKE_REPORT | ConvertFrom-Json
          if (-not $report.passed) { throw "Secondary-window smoke did not pass" }
      - name: Retain Windows smoke diagnostics
        if: matrix.platform == 'windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-secondary-window-smoke
          path: secondary-window-smoke.json
          if-no-files-found: warn
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-release-${{ matrix.artifact_label }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  android:
    name: Package Android preview (arm64)
    needs: [quality, prepare]
    runs-on: ubuntu-latest
    env:
      CI: true
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed Android preview builds"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install recorded Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install source dependencies
        run: npm ci
      - name: Regenerate Android project and configure signing
        run: |
          npm run android:init
          npm run android:configure-signing
      - name: Create ephemeral Android signing inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/keyboard-helper-preview.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          ANDROID_KEYSTORE_FILE="$keystore" npm run android:write-signing-properties
      - name: Build signed arm64 release APK
        run: ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/30.0.14904198" npm run android:build:release
      - name: Verify and stage Android preview
        shell: bash
        run: |
          export ANDROID_AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          export ANDROID_APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          version=$(jq -r '.version' package.json)
          node scripts/stage-android-preview.mjs \
            --input src-tauri/gen/android/app/build/outputs/apk \
            --output dist/android \
            --version "$version"
      - name: Upload verified Android preview
        uses: actions/upload-artifact@v4
        with:
          name: tauri-release-android-arm64-preview
          path: dist/android/**
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: needs.prepare.outputs.is_release == 'true'
    needs: [quality, prepare, build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-release-*
          path: release-assets
          merge-multiple: true
      - name: Create completed release only after all gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          declare -A asset_names=()
          for asset in "${assets[@]}"; do
            case "$asset" in
              *.AppImage|*.apk|*.deb|*.dmg|*.exe|*.msi|*.rpm|*.sha256) ;;
              *) echo "::error::Unexpected release asset: ${asset##*/}"; exit 1 ;;
            esac
            name="${asset##*/}"
            if [[ -n "${asset_names[$name]+present}" ]]; then
              echo "::error::Duplicate release asset name: $name"
              exit 1
            fi
            asset_names[$name]=1
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated Keyboard Helper release. The arm64 Android APK is a signed preview; macOS downloads are ad-hoc-signed, unnotarized preview builds."
