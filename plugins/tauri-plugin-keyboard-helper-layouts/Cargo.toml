[package]
name = "tauri-plugin-keyboard-helper-layouts"
version = "0.1.0"
description = "Purpose-bounded Android custom layout storage for Keyboard Helper Companion"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-keyboard-helper-layouts"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
